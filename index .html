<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VECTA Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#26343f; --teal:#13899a; --orange:#e8862a; --purple:#5b3d9e; --silver:#e8ecf0;
  --ink:#26343f; --muted:#6b7690; --bg:#ffffff; --surface:#f5f7fb; --line:#e3e8f0;
  --ok:#13899a; --bad:#e2504c;
  --grad:linear-gradient(90deg,var(--teal),var(--orange));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
input{font:inherit}
.bar{height:6px;background:var(--grad)}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.top img{width:48px;height:48px}
.brand{font-weight:800;letter-spacing:.08em;font-size:20px}
.brand small{display:block;font-weight:500;letter-spacing:.18em;font-size:10px;color:var(--muted)}
.mode{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}
.mode.live{background:#e5f6f3;color:var(--teal)}
.mode.off{background:#fff1e6;color:#b45a00}
#err{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#e2504c;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:92vw;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px}
.btn{background:var(--navy);color:#fff;padding:14px 26px;border-radius:14px;font-weight:600;font-size:17px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.grad{background:var(--grad)}
.btn.ghost{background:var(--surface);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
.center{text-align:center}
.tagline{letter-spacing:.25em;font-size:12px;font-weight:600;color:var(--muted)}
.tagline b:nth-child(1){color:var(--navy)} .tagline b:nth-child(2){color:var(--teal)} .tagline b:nth-child(3){color:var(--purple)}

/* ---------- host ---------- */
.lobby{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:32px;align-items:start}
.qrcard{background:#fff;border:1.5px solid var(--line);box-shadow:0 8px 30px rgba(38,52,63,.07);border-radius:24px;padding:24px;text-align:center}
.qrcard h2{font-size:28px;margin-bottom:4px}
#qr{background:#fff;padding:14px;border-radius:16px;display:inline-block;margin:14px 0}
#qr img,#qr canvas{display:block;width:260px;height:260px}
.url{font-size:13px;word-break:break-all;color:var(--muted)}
.players h3{font-size:22px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.count{background:var(--grad);color:#fff;border-radius:99px;padding:2px 14px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 16px 6px 6px;font-weight:600;animation:pop .35s ease}
.chip .av{font-size:24px;width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.chip.me{border-color:var(--teal)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.empty{padding:40px;border:2px dashed var(--line);border-radius:20px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

.qhead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.qnum{font-weight:700;color:var(--teal);letter-spacing:.1em;font-size:14px}
.timer{margin-left:auto;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:28px;background:conic-gradient(var(--orange) var(--p,100%),var(--silver) 0)}
.timer span{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center}
.qtext{font-size:clamp(24px,3.4vw,42px);font-weight:700;line-height:1.25;margin-bottom:26px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;display:flex;align-items:center;gap:14px;color:#fff;border-radius:18px;padding:22px;font-size:clamp(17px,2vw,24px);font-weight:600;text-align:left;min-height:84px}
.opt .sh{font-size:22px;opacity:.9;width:28px;text-align:center;flex:none}
.c0{background:var(--teal)} .c1{background:var(--orange)} .c2{background:var(--purple)} .c3{background:var(--navy)}
.opt.dim{opacity:.25}
.opt.right{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ok)}
.opt .n{margin-left:auto;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 12px;font-size:16px}
.answered{margin-top:18px;font-weight:600;color:var(--muted)}
.fact{margin-top:20px;background:var(--surface);border-left:5px solid var(--orange);border-radius:12px;padding:14px 18px;font-size:17px}

.board{max-width:760px;margin:0 auto}
.board h2,.final h2{font-size:34px;text-align:center;margin-bottom:20px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:16px;padding:12px 18px;margin-bottom:10px;font-weight:600;font-size:20px;animation:pop .3s ease both}
.row .rk{width:34px;font-weight:800;color:var(--muted)}
.row .av{font-size:28px}
.row .sc{margin-left:auto;font-weight:800}
.row .gn{font-size:14px;color:var(--teal);margin-left:10px}
.row.first{background:var(--grad);color:#fff}
.row.first .rk,.row.first .gn{color:#fff}

.final{text-align:center}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:30px 0}
.pod{width:min(200px,28vw)}
.pod .av{font-size:56px}
.pod .nm{font-weight:700;font-size:20px;margin:6px 0 2px;word-break:break-word}
.pod .sc{color:var(--muted);font-weight:600}
.pod .blk{margin-top:12px;border-radius:16px 16px 0 0;color:#fff;font-weight:800;font-size:40px;display:grid;place-items:center}
.p1 .blk{height:190px;background:var(--grad)} .p2 .blk{height:140px;background:var(--teal)} .p3 .blk{height:100px;background:var(--purple)}
.gift{display:inline-block;background:#fff4e3;color:#9a5a00;border-radius:16px;padding:14px 22px;font-size:20px;font-weight:600}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- player ---------- */
.phone{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.hero{text-align:center;padding:10px 0 18px}
.hero img{width:84px;height:84px}
.hero img.full{width:220px;height:auto}
.qrcard .full{width:220px;display:block;margin:0 auto 10px}
.hero h1{font-size:26px;margin-top:10px}
label{font-weight:600;font-size:14px;display:block;margin:18px 0 8px}
.field{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;font-size:18px;outline:none}
.field:focus{border-color:var(--teal)}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avbtn{font-size:32px;aspect-ratio:1;border-radius:16px;background:var(--surface);border:2.5px solid transparent}
.avbtn.on{border-color:var(--teal);background:#e5f6f3}
.full{width:100%;margin-top:22px;padding:16px}
.card{background:var(--surface);border-radius:20px;padding:22px;text-align:center;margin-top:14px}
.big{font-size:64px;line-height:1}
.pq{font-size:20px;font-weight:700;line-height:1.35;margin:10px 0 16px}
.popts{display:grid;gap:10px}
.popts .opt{min-height:66px;padding:16px;font-size:18px}
.pbar{height:8px;border-radius:99px;background:var(--silver);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--grad);width:var(--p,100%)}
.res{border-radius:20px;padding:28px 20px;text-align:center;color:#fff;margin-top:14px}
.res.ok{background:var(--ok)} .res.no{background:var(--bad)} .res.idle{background:var(--navy)}
.res h2{font-size:30px;margin:8px 0 4px}
.res .pts{font-size:22px;font-weight:700}
.mini .chip{font-size:14px;padding:4px 12px 4px 4px}
.mini .chip .av{width:30px;height:30px;font-size:18px}
.reset{position:fixed;right:10px;bottom:8px;font-size:12px;background:none;color:var(--muted);opacity:.6}
.foot{text-align:center;margin-top:26px}

@media (max-width:820px){
  .lobby{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
}
</style>
</head>

let CONN = false;
function setConn(v){ CONN = v; const m = document.getElementById("mode"); if (m) paintMode(m); }
function paintMode(m){
  if (!FIREBASE_CONFIG){ m.className = "mode"; m.textContent = "Local demo"; return; }
  m.className = "mode " + (CONN ? "live" : "off");
  m.textContent = CONN ? "● Live" : "○ Connecting…";
}
function showErr(e){
  let t = document.getElementById("err");
  if (!t){ t = document.createElement("div"); t.id = "err"; document.body.appendChild(t); }
  t.textContent = "⚠️ " + (e && e.message ? e.message : e) + " — check internet / Firebase rules";
  clearTimeout(t._h); t._h = setTimeout(() => t.remove(), 8000);
}

/* =====================================================================
   STORE — Firebase Realtime Database, or local demo
   ===================================================================== */
function makeStore(){
  if (FIREBASE_CONFIG && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const ref = db.ref("games/" + ROOM);
    let offset = 0;
    db.ref(".info/serverTimeOffset").on("value", s => offset = s.val() || 0);
    db.ref(".info/connected").on("value", s => setConn(!!s.val()));
    return {
      mode: "live",
      subscribe(cb){ ref.on("value", s => cb(s.val() || {}), e => showErr(e)); },
      update(p){ return ref.update(p).catch(showErr); },
      set(v){ return ref.set(v).catch(showErr); },
      now(){ return Date.now() + offset; },
      stamp(){ return firebase.database.ServerValue.TIMESTAMP; }
    };
  }
  const KEY = "vecta-quiz-" + ROOM;
  const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(KEY) : null;
  const subs = [];
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  const emit = () => { const s = read(); subs.forEach(f => f(s)); };
  if (bc) bc.onmessage = emit;
  window.addEventListener("storage", e => { if (e.key === KEY) emit(); });
  const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} if (bc) bc.postMessage(1); emit(); };
  function setPath(obj, path, val){
    const parts = path.split("/"); let o = obj;
    for (let i = 0; i < parts.length - 1; i++){
      if (typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {};
      o = o[parts[i]];
    }
    const k = parts[parts.length - 1];
    if (val === null) delete o[k]; else o[k] = val;
  }
  return {
    mode: "local",
    subscribe(cb){ subs.push(cb); cb(read()); },
    update(p){ const s = read(); for (const k in p) setPath(s, k, p[k]); save(s); return Promise.resolve(); },
    set(v){ save(v || {}); return Promise.resolve(); },
    now(){ return Date.now(); },
    stamp(){ return Date.now(); }
  };
}

   ===================================================================== */
const store = makeStore();
const isHost = new URLSearchParams(location.search).has("host");
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const playerURL = () => location.origin + location.pathname;
let S = {};            // current game state
let lastKey = "";      // avoid re-rendering forms while typing
let tick = null;

function pid(){
  let id = null;
  try { id = localStorage.getItem("vecta-pid"); } catch(e){}
  if (!id){ id = uid(); try { localStorage.setItem("vecta-pid", id); } catch(e){} }
  return id;
}
const ME = pid();

function players(){ return Object.entries(S.players || {}).map(([id, p]) => ({ id, ...p })); }
function ranked(){ return players().sort((a, b) => (b.score || 0) - (a.score || 0) || (a.joinedAt || 0) - (b.joinedAt || 0)); }
function answersFor(q){ return (S.answers && S.answers["q" + q]) || {}; }
function remaining(){
  if (S.phase !== "question" || !S.qStart) return QUESTION_TIME;
  return Math.max(0, QUESTION_TIME - (store.now() - S.qStart) / 1000);
}
function header(){
  return `<div class="top"><img src="${LOGO}" alt="">
    <div class="brand">VECTA<small>QUIZ CHALLENGE</small></div>
    <span class="mode" id="mode"></span></div>`;
}
function chip(p){
  return `<div class="chip ${p.id === ME && !isHost ? "me" : ""}"><span class="av">${esc(p.avatar)}</span>${esc(p.name)}</div>`;
}
function drawQR(box, text){
  const qr = new VQR.QRCode(-1, VQR.L.M);
  qr.addData(text); qr.make();
  const n = qr.getModuleCount(), quiet = 2, cell = Math.floor(520 / (n + quiet * 2));
  const size = cell * (n + quiet * 2);
  const cv = document.createElement("canvas"); cv.width = cv.height = size;
  const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, size, size);
  g.fillStyle = "#26343f";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) g.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
  box.innerHTML = ""; box.appendChild(cv);
}
function confetti(){
  if (document.querySelector(".confetti")) return;
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["#13899a","#e8862a","#5b3d9e","#9aa4ad"];
  for (let i = 0; i < 90; i++){
    const e = document.createElement("i");
    e.style.left = Math.random() * 100 + "vw";
    e.style.background = cols[i % 4];
    e.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    e.style.animationDelay = Math.random() * 1.5 + "s";
    box.appendChild(e);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 7000);
}

/* =====================================================================
   HOST
   ===================================================================== */
function resetGame(){
  return store.set({ round: uid(), phase: "lobby", q: -1, qs: buildRound(), createdAt: store.stamp() });
}
function nextQuestion(){
  const q = (S.q == null ? -1 : S.q) + 1;
  store.update({ phase: "question", q, qStart: store.stamp() });
}
let revealing = false;
function reveal(){
  if (S.phase !== "question" || revealing) return;
  revealing = true;
  const q = S.q, Q = QAT(q), ans = answersFor(q), patch = { phase: "reveal" };
  players().forEach(p => {
    const a = ans[p.id];
    let gain = 0, ok = false;
    if (a && a.c === Q.c){
      ok = true;
      const t = Math.min(QUESTION_TIME, Math.max(0, (a.t - S.qStart) / 1000));
      gain = Math.round(1000 - 500 * (t / QUESTION_TIME));   // 500–1000 pts, faster = more
    }
    patch[`players/${p.id}/score`] = (p.score || 0) + gain;
    patch[`players/${p.id}/gain`] = gain;
    patch[`players/${p.id}/ok`] = ok;
    patch[`players/${p.id}/answered`] = !!a;
  });
  store.update(patch).then(() => { revealing = false; });
}

function renderHost(){
  const ph = S.phase;
  const key = ph + ":" + S.q;
  let html = header() + `<div class="wrap">`;

  if (!ph || ph === "lobby"){
    const ps = players();
    html += `<div class="lobby">
      <div class="qrcard">
        <img class="full" src="${FULL_LOGO}" alt="VECTA">
        <h2>Scan to play!</h2>
        <div id="qr"></div>
        <div class="url">${esc(playerURL())}</div>
      </div>
      <div class="players">
        <h3>Players <span class="count">${ps.length}</span></h3>
        ${ps.length ? `<div class="chips">${ps.map(chip).join("")}</div>`
                    : `<div class="empty">Waiting for players…<br>Scan the QR code, pick a name and a character.</div>`}
        <div class="actions">
          <button class="btn grad" id="start" ${ps.length ? "" : "disabled"}>Start the quiz ▶</button>
        </div>
        <p class="muted" style="margin-top:14px">${ROUND_SIZE} questions about Tunisia, the Arab world & VECTA · ${QUESTION_TIME}s each · faster answers score more.</p>
      </div></div>`;
  }

  else if (ph === "question" || ph === "reveal"){
    const Q = QAT(S.q), ans = answersFor(S.q), total = players().length;
    const counts = [0,0,0,0]; Object.values(ans).forEach(a => { if (counts[a.c] != null) counts[a.c]++; });
    const rv = ph === "reveal";
    html += `<div class="qhead"><div class="qnum">QUESTION ${S.q + 1} / ${roundLen()}</div>
      ${rv ? "" : `<div class="timer" id="timer"><span id="tnum">${Math.ceil(remaining())}</span></div>`}</div>
      <div class="qtext">${esc(Q.q)}</div>
      <div class="opts">${Q.a.map((t, i) => `<div class="opt c${i} ${rv ? (i === Q.c ? "right" : "dim") : ""}">
        <span class="sh">${SHAPES[i]}</span>${esc(t)}${rv ? `<span class="n">${counts[i]}</span>` : ""}</div>`).join("")}</div>
      ${rv ? `<div class="fact">💡 ${esc(Q.fact)}</div>`
           : `<div class="answered">${Object.keys(ans).length} / ${total} answered</div>`}
      <div class="actions">${rv
        ? `<button class="btn" id="toBoard">Show leaderboard</button>`
        : `<button class="btn ghost" id="revealNow">Reveal answer now</button>`}</div>`;
  }

  else if (ph === "board"){
    const r = ranked().slice(0, 5), last = S.q >= roundLen() - 1;
    html += `<div class="board"><h2>Leaderboard</h2>
      ${r.map((p, i) => `<div class="row ${i === 0 ? "first" : ""}" style="animation-delay:${i * .08}s">
        <span class="rk">${i + 1}</span><span class="av">${esc(p.avatar)}</span>${esc(p.name)}
        <span class="sc">${p.score || 0}</span>${p.gain ? `<span class="gn">+${p.gain}</span>` : ""}</div>`).join("") || `<div class="empty">No players</div>`}
      <div class="actions" style="justify-content:center">
        <button class="btn grad" id="next">${last ? "Final results 🏆" : "Next question ▶"}</button></div></div>`;
  }

  else if (ph === "final"){
    const r = ranked(), top = [r[1], r[0], r[2]];
    html += `<div class="final"><h2>🏆 And the winner is…</h2>
      <div class="podium">${top.map((p, i) => p ? `<div class="pod p${[2,1,3][i]}">
        <div class="av">${esc(p.avatar)}</div><div class="nm">${esc(p.name)}</div><div class="sc">${p.score || 0} pts</div>
        <div class="blk">${[2,1,3][i]}</div></div>` : "").join("")}</div>
      ${r[0] ? `<div class="gift">🎁 ${esc(r[0].name)}, come collect your gift at the VECTA stand!</div>` : ""}
      <div class="actions" style="justify-content:center"><button class="btn" id="again">New game ↻</button></div></div>`;
  }

  html += `</div><button class="reset" id="reset">reset</button>`;
  app.innerHTML = html;
  paintMode(document.getElementById("mode"));

  // wire up
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("start", nextQuestion);
  on("revealNow", reveal);
  on("toBoard", () => store.update({ phase: "board" }));
  on("next", () => S.q >= roundLen() - 1 ? store.update({ phase: "final" }) : nextQuestion());
  on("again", resetGame);
  on("reset", () => { if (confirm("Reset the game and remove all players?")) resetGame(); });

  const qrBox = document.getElementById("qr");
  if (qrBox) drawQR(qrBox, playerURL());
  if (ph === "final" && lastKey !== key) confetti();
  lastKey = key;
}

function hostTick(){
  if (S.phase !== "question") return;
  const r = remaining();
  const t = document.getElementById("timer"), n = document.getElementById("tnum");
  if (t) t.style.setProperty("--p", (r / QUESTION_TIME * 100) + "%");
  if (n) n.textContent = Math.ceil(r);
  const total = players().length, got = Object.keys(answersFor(S.q)).length;
  if (r <= 0 || (total > 0 && got >= total)) reveal();
}

/* =====================================================================
   PLAYER
   ===================================================================== */
let pick = null;
function renderPlayer(){
  const me = (S.players || {})[ME];
  const ph = S.phase;

  if (!me){
    if (lastKey === "join") return;          // keep what the user is typing
    lastKey = "join";
    pick = pick || AVATARS[Math.floor(Math.random() * AVATARS.length)];
    app.innerHTML = `<div class="phone">
      <div class="hero"><img class="full" src="${FULL_LOGO}" alt="VECTA"><h1>Quiz Challenge</h1>
        <p class="muted">${ROUND_SIZE} quick questions about Tunisia, the Arab world & VECTA. Top score wins a gift 🎁</p></div>
      <label for="nm">Your name</label>
      <input id="nm" class="field" maxlength="16" placeholder="e.g. Sara" autocomplete="off">
      <label>Choose your character</label>
      <div class="avs">${AVATARS.map(a => `<button class="avbtn ${a === pick ? "on" : ""}" data-a="${a}">${a}</button>`).join("")}</div>
      <button class="btn grad full" id="join">Join the game</button></div>`;
    app.querySelectorAll(".avbtn").forEach(b => b.onclick = () => {
      pick = b.dataset.a;
      app.querySelectorAll(".avbtn").forEach(x => x.classList.toggle("on", x === b));
    });
    const join = () => {
      const name = document.getElementById("nm").value.trim().slice(0, 16);
      if (!name){ document.getElementById("nm").focus(); return; }
      lastKey = "";
      store.update({ [`players/${ME}`]: { name, avatar: pick, score: 0, gain: 0, joinedAt: store.stamp() } });
    };
    document.getElementById("join").onclick = join;
    document.getElementById("nm").onkeydown = e => { if (e.key === "Enter") join(); };
    return;
  }

  const r = ranked(), myRank = r.findIndex(p => p.id === ME) + 1;
  const meLine = `<div class="chip me" style="margin:0 auto;width:fit-content"><span class="av">${esc(me.avatar)}</span>${esc(me.name)} · ${me.score || 0} pts</div>`;
  let html = `<div class="phone">`;
  lastKey = ph + ":" + S.q;

  if (!ph || ph === "lobby"){
    html += `<div class="hero"><img src="${LOGO}" alt=""><h1>You're in!</h1><p class="muted">Watch the big screen — the quiz starts soon.</p></div>
      ${meLine}
      <div class="card"><b>${players().length} players</b><div class="chips mini" style="justify-content:center;margin-top:12px">${players().map(chip).join("")}</div></div>`;
  }
  else if (ph === "question"){
    const Q = QAT(S.q), mine = answersFor(S.q)[ME];
    html += `<div class="qnum">QUESTION ${S.q + 1} / ${roundLen()}</div>
      <div class="pbar" id="pbar"><i></i></div>
      <div class="pq">${esc(Q.q)}</div>`;
    if (mine){
      html += `<div class="res idle"><div class="big">${SHAPES[mine.c]}</div><h2>Answer locked!</h2><p>Let's see if you're right…</p></div>`;
    } else {
      html += `<div class="popts">${Q.a.map((t, i) => `<button class="opt c${i}" data-i="${i}"><span class="sh">${SHAPES[i]}</span>${esc(t)}</button>`).join("")}</div>`;
    }
  }
  else if (ph === "reveal"){
    const Q = QAT(S.q);
    const cls = me.ok ? "ok" : (me.answered ? "no" : "idle");
    html += `<div class="qnum">QUESTION ${S.q + 1} / ${roundLen()}</div>
      <div class="res ${cls}"><div class="big">${me.ok ? "✅" : (me.answered ? "❌" : "⏱️")}</div>
      <h2>${me.ok ? "Correct!" : (me.answered ? "Not this time" : "Time's up")}</h2>
      <div class="pts">+${me.gain || 0} pts</div></div>
      <div class="card"><span class="muted">Right answer</span><br><b>${esc(Q.a[Q.c])}</b></div>
      <div class="card" style="text-align:left">💡 ${esc(Q.fact)}</div>`;
  }
  else if (ph === "board"){
    html += `<div class="hero"><h1>You're #${myRank}</h1><p class="muted">of ${r.length} players</p></div>${meLine}
      <div class="card" style="text-align:left">${r.slice(0, 5).map((p, i) => `<div class="row ${i === 0 ? "first" : ""}" style="font-size:16px">
        <span class="rk">${i + 1}</span><span class="av" style="font-size:22px">${esc(p.avatar)}</span>${esc(p.name)}<span class="sc">${p.score || 0}</span></div>`).join("")}</div>`;
  }
  else if (ph === "final"){
    const win = myRank === 1;
    html += `<div class="res ${win ? "ok" : "idle"}"><div class="big">${win ? "🏆" : (myRank <= 3 ? "🥈" : "👏")}</div>
      <h2>${win ? "You won!" : "Thanks for playing!"}</h2><div class="pts">#${myRank} · ${me.score || 0} pts</div></div>
      ${win ? `<div class="card"><b>🎁 Come to the VECTA stand to collect your gift!</b></div>` : ""}
      <div class="card"><b>Smart Vision Glasses by VECTA</b><p class="muted" style="margin-top:6px">Affordable technology that restores independence. Visit our stand to try them!</p></div>`;
    if (win) setTimeout(confetti, 100);
  }
  html += `</div>`;
  app.innerHTML = html;

  app.querySelectorAll(".popts .opt").forEach(b => b.onclick = () => {
    if (answersFor(S.q)[ME] || remaining() <= 0) return;
    app.querySelectorAll(".popts .opt").forEach(x => x.disabled = true);
    store.update({ [`answers/q${S.q}/${ME}`]: { c: +b.dataset.i, t: store.stamp() } });
  });
}
function playerTick(){
  const bar = document.getElementById("pbar");
  if (bar) bar.style.setProperty("--p", (remaining() / QUESTION_TIME * 100) + "%");
}

/* =====================================================================
   BOOT
   ===================================================================== */
store.subscribe(state => {
  S = state || {};
  if (isHost && (!S.round || !S.qs)){ resetGame(); return; }
  isHost ? renderHost() : renderPlayer();
});
tick = setInterval(isHost ? hostTick : playerTick, 250);
</script>
</body>
</html>
